name: Build

on: 
  - pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # matrix.go only keeps the required check name "test (stable, <os>)".
    # The compiler version comes from go.mod.
    strategy:
      matrix:
        go: ["stable"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...
  lint:
    # matrix.go only keeps the required check name "lint (stable, ubuntu-latest)".
    # The compiler version comes from go.mod.
    strategy:
      matrix:
        go: ["stable"]
        os: [ubuntu-latest]
    name: lint
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin the minor. The action installs the latest patch of that minor.
          # v2.13 cannot type-check Go 1.27 export data, so stay on a current v2.
          version: v2.15
          skip-cache: true
